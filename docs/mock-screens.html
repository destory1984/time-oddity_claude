<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시간 한량 화면 어림 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
/* 게임이 대충 어떤 모습이 될지 보려는 어림 그림이다. 땅 그림은 임시로 그린 것이고, 실제 그림은 발주서로 주문한다. */
:root{--night:#050330;--navy:#1a2894;--gold:#f6b951;--white:#fbf8f9;--lav:#e2daf6;--paper:#f2e6c8;--ink:#3b2a1a}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Gowun Batang","Malgun Gothic",serif;line-height:1.7}
main{max-width:1500px;margin:0 auto;padding:36px 20px 70px}
h1{font-size:2rem;margin:0 0 6px}
p{max-width:46em;margin:.3em 0}
.grid{display:flex;flex-wrap:wrap;gap:40px 30px;margin-top:26px}
figure{margin:0;width:375px}
figcaption{margin-top:12px;font-size:.95rem}
figcaption b{font-size:1.1rem;display:block}

.ph{position:relative;width:375px;height:812px;border-radius:30px;overflow:hidden;box-shadow:0 0 0 7px #1b1730,0 16px 34px rgba(59,42,26,.35);
  font-family:"Malgun Gothic",system-ui,sans-serif;color:var(--white);font-size:13px;line-height:1.4}
.ph>*{position:absolute}
.dusk{background:linear-gradient(#070640 0%,#1a2894 30%,#5a4fa8 46%,#c9879a 54%,#f2c08a 58%)}
.space{background:radial-gradient(circle at 50% 60%,#131760 0%,#050330 60%)}
.full{inset:0;width:100%;height:100%}
.glass{background:rgba(5,3,48,.6);border:1px solid rgba(226,218,246,.45);border-radius:16px}
.top{top:12px;left:12px;right:12px;display:flex;gap:6px}
.top span{height:34px;min-width:34px;padding:0 9px;display:grid;place-items:center;font-size:12px}
.top .j{margin-left:auto;color:var(--gold);border-color:var(--gold)}
.date{top:60px;left:18px;text-shadow:0 1px 6px rgba(5,3,48,.6)}
.date b{display:block;font-size:36px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.sora{width:96px;image-rendering:pixelated}
.bubble{background:var(--white);color:#1b1730;padding:7px 12px;border-radius:14px 14px 14px 2px;font-size:13.5px;white-space:nowrap}
.memo{background:var(--paper);color:var(--ink);padding:5px 12px;transform:rotate(-1.5deg);font-family:"Nanum Pen Script",cursive;font-size:22px;line-height:1.15;box-shadow:1px 2px 0 rgba(59,42,26,.45)}
.chips{display:flex;gap:6px}.chips span{padding:4px 10px;font-size:12px}
.today{padding:8px 14px;border-color:var(--gold);color:var(--gold)}
.joy{left:18px;bottom:128px;width:66px;height:66px;border-radius:50%;display:grid;place-items:center}
.joy::after{content:"";width:28px;height:28px;border-radius:50%;background:rgba(226,218,246,.55)}
.move{right:18px;bottom:128px;display:grid;gap:6px}.move span{padding:7px 13px;font-size:12px}
/* 해 다이얼 */
.arc{left:-243px;bottom:-760px;width:860px;height:860px;border-radius:50%;border:2px solid var(--gold);
  background:radial-gradient(closest-side,rgba(5,3,48,.86) 96.5%,transparent 96.6%),repeating-conic-gradient(from -0.1deg,rgba(251,248,249,.9) 0 .2deg,transparent .2deg 1.6deg),rgba(5,3,48,.86)}
.arclab{left:0;right:0;bottom:56px;display:flex;justify-content:space-between;padding:0 30px;font-size:11px}
.arclab span:nth-child(2){transform:translateY(-22px)}.arclab span:nth-child(1),.arclab span:nth-child(3){transform:translateY(4px)}
.needle{left:50%;bottom:98px;margin-left:-8px;border:8px solid transparent;border-top:15px solid var(--gold);border-bottom:0}
/* 지구 */
.earth{left:-122px;top:150px;width:620px;height:620px;border-radius:50%;background:url(mock/earth.jpg) -362px 0/1240px 620px;
  box-shadow:inset -70px -50px 120px rgba(5,3,48,.85),inset 20px 20px 60px rgba(120,160,255,.25),0 0 50px rgba(110,150,255,.45)}
.pin{width:12px;height:12px;margin:-6px;border-radius:50%;background:var(--white);box-shadow:0 0 0 3px rgba(5,3,48,.5)}
.pin.on{background:var(--gold);box-shadow:0 0 0 3px rgba(246,185,81,.35),0 0 14px var(--gold)}
.pinlab{font-size:11px;white-space:nowrap;text-shadow:0 1px 4px #050330}
.card{padding:9px 13px;border-color:var(--gold);white-space:nowrap}
.card b{color:var(--gold);font-size:14px}
/* 수첩과 엽서 */
.dim{inset:0;background:rgba(5,3,48,.62)}
.book{left:14px;right:14px;top:58px;bottom:22px;background:var(--paper);color:var(--ink);border-radius:6px 14px 14px 6px;border-left:12px solid #6b4a2b;
  padding:16px 16px 0 14px;font-family:"Gowun Batang",serif;background-image:repeating-linear-gradient(transparent 0 27px,#dccb9f 27px 28px);box-shadow:0 10px 30px rgba(0,0,0,.5);overflow:hidden}
.book h3{margin:0;font-size:20px}.book small{font-size:12px}
.tabs{display:flex;gap:4px;margin:10px 0 0}
.tabs span{padding:3px 12px;border:1px solid var(--ink);border-bottom:0;border-radius:7px 7px 0 0;font-size:13px}
.tabs .on{background:var(--ink);color:var(--paper)}
.path{border-top:2px solid var(--ink);padding:8px 0 4px}
.hand{font-family:"Nanum Pen Script",cursive;font-size:21px;line-height:1.15}
.row{display:grid;grid-template-columns:22px 1fr auto;gap:2px 6px;padding:7px 0;border-bottom:1px dashed #b9a777;font-size:13px;align-items:center}
.row i{font-style:normal;font-size:16px}.row b{font-size:14px}
.row em{grid-column:2/4;font-style:normal;color:#6b4a2b}
.row u{text-decoration:none;border:1px solid var(--ink);border-radius:4px;padding:1px 8px;font-size:12px}
.row.no{opacity:.55}
.post{left:22px;right:22px;top:92px;background:#f7efd9;color:var(--ink);padding:12px;box-shadow:0 10px 30px rgba(0,0,0,.5);transform:rotate(-1.2deg)}
.post svg{display:block;width:100%;border:1px solid #cbb98c}
.stamp{right:40px;top:296px;width:46px;height:54px;background:var(--navy);border:3px dotted #f7efd9;outline:1px solid var(--navy)}
.mark{right:74px;top:300px;width:66px;height:66px;border:2px solid rgba(59,42,26,.6);border-radius:50%;display:grid;place-items:center;font-size:10px;color:rgba(59,42,26,.75);transform:rotate(-14deg);font-family:"Gowun Batang",serif}
.reply{left:34px;right:34px;top:470px;background:var(--paper);color:var(--ink);padding:16px 18px;transform:rotate(1deg);box-shadow:0 8px 24px rgba(0,0,0,.45)}
.reply small{display:block;font-family:"Gowun Batang",serif;font-size:12px;margin-bottom:4px}
</style>
</head>
<body>
<main>
<h1>시간 한량 화면 어림 5</h1>
<p>게임이 대충 어떤 모습이 될지 보려고 만든 그림 5장이다. 움직이지 않는다.</p>
<p>땅 그림은 그림체를 짐작하려고 임시로 그린 것이다. 실제 그림은 <code>art-order-test-10.md</code> 로 주문한다. 달과 별도 계산한 것이 아니다. 글귀는 기획서의 본보기를 그대로 옮겼다.</p>
<div class="grid" id="grid"></div>
</main>
<script>
const rnd = (i, k) => Math.abs(Math.sin(i * 12.9898 + k * 78.233) * 43758.5453) % 1;
const stars = (n, h, seed = 0) => Array.from({ length: n }, (_, i) =>
  `<circle cx="${(rnd(i, seed) * 375).toFixed(1)}" cy="${(rnd(i, seed + 5) * h).toFixed(1)}" r="${(0.4 + rnd(i, seed + 9) * 1).toFixed(2)}" fill="#fbf8f9" opacity="${(0.4 + rnd(i, seed + 3) * 0.6).toFixed(2)}"/>`).join('');
const moon = (x, y, r) => `<path transform="translate(${x} ${y}) rotate(-20)" d="M0 ${-r}A${r} ${r} 0 1 0 0 ${r}A${r * 0.62} ${r} 0 1 1 0 ${-r}z" fill="#f4f1ff"/>`;
const tree = (x, y, s) => `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-4" y="-40" width="8" height="42" fill="#27402f"/><circle cx="0" cy="-70" r="34"/><circle cx="-26" cy="-50" r="24"/><circle cx="26" cy="-52" r="26"/><circle cx="4" cy="-96" r="22"/></g>`;
const person = (x, y, s = 1) => `<g transform="translate(${x} ${y}) scale(${s})" fill="#1f2b3a"><circle cy="-13" r="2.6"/><path d="M-3 -10h6l2 10h-10z"/></g>`;

// 하이드파크. then 이면 수정궁이 있고, 아니면 잔디밭뿐이다. 두 장은 구도가 같다.
function park(then) {
  const mull = Array.from({ length: 45 }, (_, i) => `<path d="M${33 + i * 7} 470V500" stroke="#86b7b1" stroke-width="1"/>`).join('')
    + Array.from({ length: 36 }, (_, i) => `<path d="M${63 + i * 7} 452V470" stroke="#86b7b1" stroke-width="1"/>`).join('')
    + Array.from({ length: 26 }, (_, i) => `<path d="M${98 + i * 7} 438V452" stroke="#86b7b1" stroke-width="1"/>`).join('');
  const palace = `<g>
    <rect x="30" y="470" width="315" height="30" fill="#bfe0dc"/><rect x="60" y="452" width="255" height="18" fill="#cfeae6"/><rect x="95" y="438" width="185" height="14" fill="#dcf2ee"/>
    ${mull}
    <path d="M163 500V420a24.500 24.500 0 0 1 49 0V500z" fill="#e9f8f5"/>
    <path d="M163 420a24.500 24.500 0 0 1 49 0M171 420a16.500 16.500 0 0 1 33 0M179 420a8.500 8.500 0 0 1 17 0M187.500 396V500M163 440h49M163 460h49M163 480h49" fill="none" stroke="#86b7b1" stroke-width="1"/>
    <path d="M30 470h315M60 452h255M95 438h185" stroke="#6fa39d" stroke-width="1.500"/>
    ${[40, 110, 265, 335].map(x => `<path d="M${x} ${x > 100 && x < 300 ? 438 : 470}v-14l9 4-9 4" fill="#c9553a" stroke="#6fa39d" stroke-width=".8"/>`).join('')}
  </g>`;
  const city = then
    ? `<path d="M0 478l20-6 14 4 10-14 6 14 30 2 12-8 16 8h60l8-20 5 20 60 2 20-6 30 6 20-10 14 10 50-2V520H0z" fill="#8f86c4" opacity=".7"/>`
    : `<path d="M0 478h30v-22h14v22h40v-40h12v40h30v-14h20v14h50v-58h9v58h44v-28h16v28h40v-46h12v46h58V520H0z" fill="#8f86c4" opacity=".7"/>`;
  const crowd = then
    ? Array.from({ length: 26 }, (_, i) => person(40 + rnd(i, 1) * 295, 512 + rnd(i, 2) * 26, 0.8 + rnd(i, 3) * 0.5)).join('')
    : person(96, 530) + person(104, 531, 0.9) + person(268, 522, 0.8);
  return `<svg class="full" viewBox="0 0 375 812" preserveAspectRatio="none">
    ${stars(70, 340, then ? 1 : 4)}${moon(then ? 282 : 96, then ? 170 : 210, 19)}
    ${city}
    <path d="M0 500q90-10 187 0t188-2V812H0z" fill="#6c9a62"/>
    ${then ? palace : ''}
    <path d="M0 540q100-16 200-4t175-8V812H0z" fill="#527f52"/>
    ${crowd}
    <g fill="#2f5a3c">${tree(44, 600, 1.25)}${tree(338, 588, 1.05)}</g>
    <path d="M0 612q120-22 230-6t145-10V812H0z" fill="#3c6846"/>
    <path d="M0 690q140-26 375-6V812H0z" fill="#2d5239"/>
    <rect y="400" width="375" height="412" fill="#1a2894" opacity=".2"/>
  </svg>`;
}

// 1504년 자메이카의 월식. 엽서에 들어가는 작은 그림.
const jamaica = `<svg viewBox="0 0 300 170">
  <rect width="300" height="170" fill="#0a0a4a"/>
  ${Array.from({ length: 40 }, (_, i) => `<circle cx="${rnd(i, 7) * 300}" cy="${rnd(i, 8) * 90}" r="${0.4 + rnd(i, 9)}" fill="#fbf8f9" opacity=".8"/>`).join('')}
  <circle cx="204" cy="48" r="21" fill="#c9553a"/><circle cx="204" cy="48" r="21" fill="none" stroke="#e08a6a" stroke-width="1.500" opacity=".6"/>
  <rect y="108" width="300" height="62" fill="#1c3f72"/><path d="M0 120h300M0 134h300M0 150h300" stroke="#2c5a94" stroke-width="2" stroke-dasharray="30 18"/>
  <path d="M176 104h56l-10 12h-36zM206 104V80M196 104V86" fill="#03040f" stroke="#03040f" stroke-width="2"/><path d="M207 82l12 9-12 9zM195 88l-10 8 10 7z" fill="#e2daf6"/>
  <path d="M0 108q50-26 96-6l24 6V170H0z" fill="#0f2a22"/>
  <g stroke="#0f2a22" stroke-width="3" fill="none"><path d="M40 108q6-30 2-46"/><path d="M84 110q-4-22 4-40"/></g>
  <g fill="#0f2a22"><path d="M42 62q-22-10-30 4q18-6 30-4zM42 62q20-14 32-2q-18-4-32 2zM42 62q-6-18-22-18q14 6 22 18zM42 62q10-18 24-14q-14 4-24 14z"/><path d="M88 70q-20-8-28 4q16-6 28-4zM88 70q18-12 30-2q-16-4-30 2zM88 70q8-18 22-14q-12 4-22 14z"/></g>
</svg>`;

const topBar = n => `<div class="top"><span class="glass">소리</span><span class="glass">음악</span><span class="glass">?</span><span class="glass j">수첩 ${n}/120</span><span class="glass">사진</span></div>`;
const dialArc = (a, b, c) => `<div class="arc"></div><div class="arclab"><span>${a}</span><span>${b}</span><span>${c}</span></div><div class="needle"></div>`;
const controls = `<div class="joy glass"></div><div class="move"><span class="glass">전진</span><span class="glass">정지</span></div>`;
const pin = (lon, lat, label, on) => { const x = 188 + (lon - 15) / 90 * 310, y = 460 - lat / 90 * 310;
  return `<div class="pin ${on ? 'on' : ''}" style="left:${x}px;top:${y}px"></div>${on ? '' : `<div class="pinlab" style="left:${x + 11}px;top:${y - 9}px">${label}</div>`}`; };

const S = [
 { n: '지구 위에서 자리를 고른다', d: '1권처럼 지구 위를 날아 자리를 찾는다. 수첩에 적힌 자리가 점으로 보이고, 가까이 가면 이름표가 뜬다. 내려가면 그 자리의 땅이 된다.',
   h: `<div class="ph space"><svg class="full" viewBox="0 0 375 812" preserveAspectRatio="none">${stars(110, 812, 2)}</svg>
   <div class="earth"></div>
   ${pin(31.1, 30, '기자')}${pin(12.5, 41.9, '로마')}${pin(23.7, 38, '아테네')}${pin(-3, 16.8, '팀북투')}${pin(29, 41, '콘스탄티노플')}${pin(-0.1, 51.5, '', 1)}
   <div class="card glass" style="left:150px;top:232px"><b>64 수정궁</b><br>1851.5.1 하이드파크</div>
   <img class="sora" src="mock/sora.png" style="left:34px;top:452px">
   ${topBar(63)}<div class="date"><b>1851.5.1</b>지구 상공 9,129 km</div>
   ${controls}${dialArc(1840, 1851, 1860)}</div>` },
 { n: '그날 그 자리에 선다', d: '땅에 닿으면 그림 한 장과 하늘이 뜬다. 글은 할머니 메모 한 줄과 소라 한마디뿐이다. 이야기 카드와 문제는 접혀 있다. 아래 다이얼로 해를 돌린다.',
   h: `<div class="ph dusk">${park(true)}
   <img class="sora" src="mock/sora.png" style="left:132px;top:232px"><div class="bubble" style="left:206px;top:214px;white-space:normal;width:150px">유리로 지은 집이다. 반짝반짝.</div>
   ${topBar(64)}<div class="date"><b>1851.5.1</b>하이드파크, 런던</div>
   <div class="memo" style="left:16px;top:528px">1851.5.1 만국박람회 열림.<br>그날 달은 ○</div>
   <div class="chips" style="left:16px;top:590px"><span class="glass">이야기 카드</span><span class="glass">맞혀 보렴</span></div>
   <div class="today glass" style="right:16px;top:64px">오늘로</div>
   ${controls}${dialArc(1840, 1851, 1860)}</div>` },
 { n: '오늘로 돌리면 남은 것이 보인다', d: '같은 자리, 같은 구도에서 다이얼을 오늘로 돌린다. 수정궁이 서서히 사라지고 잔디밭이 남는다. 이것으로 "남은 것" 칸이 채워진다.',
   h: `<div class="ph dusk">${park(false)}
   <img class="sora" src="mock/sora.png" style="left:132px;top:232px"><div class="bubble" style="left:216px;top:226px">없어졌네.</div>
   ${topBar(64)}<div class="date"><b>2026.10.7</b>하이드파크, 런던</div>
   <div class="memo" style="left:16px;top:548px">남은 것: 없음. 잔디밭뿐.</div>
   <div class="today glass" style="right:16px;top:64px">그날로</div>
   ${controls}${dialArc(2020, '오늘', 2030)}</div>` },
 { n: '수첩에서 칸을 눌러 먼 시대로 간다', d: '먼 시대는 다이얼로 가지 않고 수첩에서 칸을 눌러 간다. 칸은 120개이고, 할머니가 적어 둔 길 9개로도 묶여 있다. 채운 칸에는 메모와 소라의 덧글이 남는다.',
   h: `<div class="ph dusk">${park(true)}<div class="dim"></div>${topBar(64)}
   <div class="book"><h3>할머니의 수첩 2권</h3><small>날 64/120 · 하늘 58 · 남은 것 41</small>
   <div class="tabs"><span>날</span><span class="on">길</span><span>쪽지</span></div>
   <div class="path"><b>길 1. 하늘이 바꾼 날</b><div class="hand">"하늘을 아는 사람이 이겼단다"</div></div>
   ${[['✓', '7 탈레스의 일식', '기원전 585.5.28 할리스 강'], ['✓', '22 손님별', '1054.7.4 카이펑'], ['✓', '23 혜성', '1066.4 노르망디'],
      ['✓', '39 콜럼버스의 월식', '1504.2.29 자메이카', '소라: 달이 진짜 빨개졌어! 근데 좀 치사하다.'], ['', '52 금성이 해를 지남', '1769.6.3 타히티'], ['', '86 빛이 휘는 것을 잼', '1919.5.29 프린시페'], ['', '120 블랙홀의 첫 사진', '2019.4.10 워싱턴']]
     .map(r => `<div class="row ${r[0] ? '' : 'no'}"><i>${r[0] || '○'}</i><div><b>${r[1]}</b><br>${r[2]}</div><u>가기</u>${r[3] ? `<em class="hand">${r[3]}</em>` : ''}</div>`).join('')}
   </div></div>` },
 { n: '찍은 사진은 엽서가 되고 답장이 온다', d: '소라가 찍은 사진은 땅 그림과 그날 하늘을 합친 엽서가 된다. 할머니께 보내면 답장이 돌아온다. 마음을 말하는 것은 답장뿐이다.',
   h: `<div class="ph space"><svg class="full" viewBox="0 0 375 812" preserveAspectRatio="none">${stars(90, 812, 6)}</svg><div class="dim" style="background:rgba(5,3,48,.3)"></div>${topBar(40)}
   <div class="post">${jamaica}<div class="hand" style="margin-top:10px;padding-right:70px">1504.2.29 자메이카.<br>달이 진짜 빨개졌어!<br>근데 좀 치사하다. — 소라</div></div>
   <div class="stamp"></div><div class="mark">1504<br>2.29</div>
   <div class="reply"><small>할머니의 답장</small><div class="hand" style="font-size:25px">달력표 한 장이 그렇게 쓰였단다.<br>아는 것은 그렇게도 쓰이는구나.</div></div>
   <div class="today glass" style="left:50%;transform:translateX(-50%);top:640px;white-space:nowrap">사진첩에 넣기</div></div>` },
];
document.getElementById('grid').innerHTML = S.map((s, i) => `<figure>${s.h}<figcaption><b>${i + 1}. ${s.n}</b>${s.d}</figcaption></figure>`).join('');
// 주소 끝에 #s2 처럼 붙이면 한 장만 보인다(그림 파일로 찍을 때 쓴다).
const one = location.hash.match(/^#s(\d+)$/);
if (one) { const m = document.querySelector('main'); m.replaceChildren(document.querySelectorAll('.ph')[one[1] - 1]); m.style.cssText = 'padding:10px;margin:0;width:395px'; }
</script>
