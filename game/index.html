<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050330">
<title>시간 한량</title>
<!-- The three voices have three hands, as in volume 1: the screen is Pretendard,
     grandmother writes in Nanum Pen Script, Sora in Gaegu. All shipped with the game. -->
<link rel="stylesheet" href="./fonts/pretendard/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="./fonts/nanum-pen-script/400.css">
<link rel="stylesheet" href="./fonts/gaegu/400.css">
</head>
<body>
<div id="stage">
  <canvas id="globe"></canvas>
  <div id="pins"></div>
  <canvas id="sky"></canvas>
  <div id="ground"></div>
  <div id="glowSky"></div>
  <img id="sora" src="./sora.png" alt="">
  <div id="hud">
    <div id="top"><span id="dots"><i></i><i></i><i></i></span><span id="name"></span></div>
    <div id="date"><b id="dateText"></b><span id="placeText"></span><span id="subText"></span></div>
    <button id="todayBtn" class="glass" type="button">오늘로</button>
    <button id="leaveBtn" class="glass" type="button">떠나기</button>
    <div id="bubble"></div>
    <div id="memo"></div>
    <div id="hint"></div>
  </div>
  <canvas id="dial"></canvas>
  <div id="fade"></div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
